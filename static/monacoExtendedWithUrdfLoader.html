<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <!-- Page & Monaco styling -->
    <link href="styles.css" rel="stylesheet" />
    <title>Simple Scene Description Language</title>
</head>

<body>

    <main id="flex-window-container">

        <header id="flex-window-item-header" class="flex-window-item">
            <h1>Simple Scene Description Language</h1>
        </header>

        <div id="flex-window-item-content" class="flex-window-item grid-layout-container">
            <div id="monaco-editor-root" class="grid-layout-item grid-layout-item-editor"></div>
            <div id="rendered-view" class="grid-layout-item grid-layout-item-viewer"></div>
            <div id="urdf-output" class="grid-layout-item grid-layout-item-output"></div>
        </div>

        <footer id="flex-window-item-footer" class="flex-window-item">
            <img width="125" src="https://langium.org/assets/langium_logo_w_nib.svg" alt="Langium">
        </footer>

    </main>

    <script type="module">
        import { configureMonacoWorkers } from '../src/setupCommon';
        import { executeExtended } from '../src/setupExtended';

        configureMonacoWorkers();
        const startingPromise = executeExtended(document.getElementById('monaco-editor-root'));
    </script>
</body>

</html>
